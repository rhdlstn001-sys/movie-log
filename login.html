<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - 영화 기록</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="nav-wrap">
    <a class="nav-brand" href="index.html">🎬 영화 기록</a>
    <nav class="nav-links">
      <a href="index.html">소개</a>
      <a href="board.html">게시판</a>
      <a href="wishlist.html">볼 영화 목록</a>
      <a href="login.html" class="active">로그인</a>
    </nav>
    <div class="nav-auth" id="nav-auth"></div>
  </div>
</header>

<main class="container">
  <div class="login-box panel">
    <h1 class="page-title">로그인</h1>
    <p class="page-sub">작성자 본인만 게시판/볼 영화 목록을 등록·수정·삭제할 수 있습니다.<br>비로그인 상태에서도 열람은 누구나 가능합니다.</p>

    <form id="login-form">
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="primary">로그인</button>
    </form>
    <p class="login-msg" id="login-msg"></p>
  </div>
</main>

<footer class="site-footer">개인 영화 기록 사이트</footer>

<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/login.js"></script>
</body>
</html>
